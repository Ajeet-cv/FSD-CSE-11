    <script>const URL = "https://dummyjson.com/products?limit=10&skip=2";
const CURRENCY_URL = "https://api.frankfurter.dev/v2/rate/USD/INR";
let products = [];
let cart = [];
async function loadproduct() {
    try {
        let rows = "";
        const res = await fetch(URL);
        console.log("res=", res);
        const data = await res.json();
        console.log("data=", data.products);
        products = data.products;
        const currencyRes = await fetch(CURRENCY_URL);
        console.log("Currency response =", currencyRes);
        const currencyData = await currencyRes.json();
        console.log("Currency data =", currencyData);
        const rate = currencyData.rate;
        console.log("1 USD =", rate, "INR");
        data.products.map((i, index)=>{
            const priceInRupee = (i.price * rate).toFixed(2);
            rows += `<tr>
                     <td> ${index + 1}</td>
                    <td> ${i.title}</td>
                    <td> <img src="${i.thumbnail}" alt="${i.title}" width="80px"></td>
                    <td> ${i.category}</td>
                    <td> ${i.rating}</td>
                    <td> \u{20B9}${priceInRupee}</td>
                    <td> ${i.stock}</td>
                    <td><button onclick="addToCart(${i.id})">Add to Cart</button></td>
                       </tr>`;
        });
        const el = document.getElementById("data");
        el.innerHTML = rows;
    } catch (err) {
        console.log("Error:", err);
    }
}
function addToCart(id) {
    id = Number(id);
    const product = products.find((i)=>i.id === id);
    if (!product) {
        console.log("Product not found:", id);
        return;
    }
    cart.push(product);
    console.log("Cart =", cart);
    alert(product.title + " added to cart");
}
loadproduct();

</script>
