<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo fetch</title>
    <style>
        table{
            width:80vw;
            background: aqua;
            border-collapse: collapse;
            margin:auto;
        }
        th,td{
            border: 2px solid black;
            text-align: center;
        }
    </style>
    <script>
        let rate=0;
        async function loadproduct(){
            const url = "https://dummyjson.com/products?limit=10&skip=5";
            try{
                const res = await fetch(url);
                console.log("res=",res);
                const data = await res.json();
                console.log("data=",data.products);
                let rows="";
                data.products.map((i,index)=>(
                   rows=rows+`
                    <tr>
                        <td>${index+1}</td>
                        <td>${i.title}</td>
                        <td><img src="${i.images[0]}"width=50 height=50/></td>
                        <td>${i.category}</td>
                        <td>${i.rating}</td>
                        <td>${(i.price*rate).toFixed(2)}₹</td>
                        <td>${i.stock}</td>
                        <td><button>Add to cart</button></td>
                        </tr>`
                                ));
                        const el= document.getElementById("data");
                        el.innerHTML = rows;
            }
            catch(err){
               console.log("error=",err);
            }
        }
        async function getrate(){
            const URL = "https://open.er-api.com/v6/latest/USD";
            try{
                const res = await fetch(URL);
                const rate = await res.json();
                console.log("INRrate=", rate.rates.INR);
                return rate.rates.INR;
            }
            catch(err){
                console.log("error=",err);
            }
        }
        const test= async()=>{
        rate=await getrate();
          console.log("rate=",rate);
        }
        test();
        loadproduct();

    </script>
</head>
<body>
    <h1><center>List Of Product</center></h1>
    <table>
        <thead>
            <tr>
                <th>Sr.No.</th>
                <th>Title</th>
                <th>Images</th>
                <th>Category</th>
                <th>Rating</th>
                <th>Price(₹)</th>
                <th>Stock</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="data"></tbody>
    </table>
</body>
</html>
